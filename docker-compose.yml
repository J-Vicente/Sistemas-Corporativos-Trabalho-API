services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chamados
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamados -d chamados"]
      interval: 5s
      timeout: 5s
      retries: 20


  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chamados
      DB_USERNAME: chamados
      DB_PASSWORD: ${DB_PASSWORD:-chamados}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
